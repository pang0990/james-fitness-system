name: JFS UI integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "app-source/**"
      - ".github/workflows/jfs-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-audit:
    name: Desktop and mobile browser baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run existing browser suite (baseline)
        run: |
          mkdir -p ../work
          npm run test:e2e -- --workers=2 --trace=retain-on-failure
        env:
          CI: "true"
      - name: Preserve browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfs-browser-audit
          path: |
            app-source/test-results/
            app-source/playwright-report/
            work/
          if-no-files-found: ignore
          retention-days: 7
