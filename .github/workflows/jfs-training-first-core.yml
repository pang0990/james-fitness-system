name: JFS Training-first Shared Core QA
on:
  pull_request:
    branches:
      - integration/glass-training-v3-20261021
      - feat/training-first-shared-core-v2-20261021
    paths:
      - "app-source/**"
      - ".github/workflows/jfs-training-first-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-core:
    name: Web parity and Training Core regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Full four-workspace and Training/Glass browser regression
        run: npm run test:e2e -- --workers=1 --timeout=20000 --trace=retain-on-failure
        env:
          CI: "true"
      - name: Upload failure traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfs-training-first-core-qa
          path: |
            app-source/test-results/
            app-source/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
