name: JFS Nutrition B2 one-time approved live release

# Temporary one-shot release path for the explicitly approved Nutrition B2 rollout.
# An ordinary push can never deploy; the single exact marker is required.
# Remove this workflow immediately after verifying the live release.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jfs-pages-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[jfs-nutrition-b2-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Release smoke tests for Nutrition B2 and existing workflows
        run: npm run test:e2e -- tests/e2e/nutrition-logger.spec.ts tests/e2e/app.spec.ts tests/e2e/ds3-showcase-nutrition.spec.ts tests/e2e/guest-entry.spec.ts tests/e2e/training-overview.spec.ts tests/e2e/training-v3.spec.ts --workers=1
        env:
          CI: "true"
          PLAYWRIGHT_CHANNEL: chrome
      - name: Build the real GitHub Pages base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /james-fitness-system
      - name: Exclude development pages, record deployed main SHA
        run: |
          rm -rf out/ui-showcase out/dev
          node -e 'require("fs").writeFileSync("out/release.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID}))'
          test -s out/nutrition/index.html
          test -s out/training/index.html
          test -s out/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-source/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
