name: JFS Training Sync Dev DB Isolation
on:
  pull_request:
    branches: [main]
    paths:
      - "app-source/supabase/**"
      - "app-source/src/lib/training-core/**"
      - "app-source/src/lib/training-offline/**"
      - "app-source/tests/training-offline-*.test.ts"
      - "app-source/tests/e2e/training-offline-*.spec.ts"
      - "app-source/tests/fixtures/offline-browser-harness.ts"
      - ".github/workflows/jfs-training-sync-dev-db.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-negative-tests:
    name: Isolated Postgres RLS and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: jfs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jfs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: jfs_ci
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify account and Training RLS/RPC using service PostgreSQL client
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          db() {
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER" \
              psql -X -h 127.0.0.1 -U postgres -d jfs_ci -v ON_ERROR_STOP=1 "$@"
          }
          # Use the client shipped with postgres:16. No apt or external
          # runner package mirrors, and no live Supabase access.
          db < app-source/supabase/tests/bootstrap_auth_stub.sql
          db -c "create table auth.users (id uuid primary key);"
          db < app-source/supabase/migrations/202611250001_account_cloud_snapshots.sql
          db < app-source/supabase/tests/account_snapshots_contract.sql
          db < app-source/supabase/migrations/202610220001_training_dev_foundation.sql
          db < app-source/supabase/tests/session_rpc_isolation.sql
          test "$(db -Atc "select has_schema_privilege('authenticated','jfs_training_dev','USAGE');")" = "f"
  web-safety:
    name: Shared Training Core unchanged and Web builds
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle isolated IndexedDB adapter for real browser checks
        run: ./node_modules/.bin/esbuild tests/fixtures/offline-browser-harness.ts --bundle --format=iife --platform=browser --target=es2022 --outfile=test-output/jfs-offline-harness.js
      - run: npx playwright install --with-deps chromium
      - name: Test actual Chromium IndexedDB atomic transaction and persistence
        run: npm run test:e2e -- tests/e2e/training-offline-indexeddb.spec.ts --workers=1 --trace=retain-on-failure
        env:
          CI: "true"
