name: Build and publish JFS Pages

# A release requires an explicit manual confirmation on main.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Publish the validated main revision to the live website"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jfs-pages-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_release == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Verify nutrition, training and guest persistence
        run: npm run test:e2e -- --workers=1
        env:
          CI: "true"
          PLAYWRIGHT_CHANNEL: chrome
      - name: Build production base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /james-fitness-system
      - name: Exclude development pages and identify the release
        run: |
          rm -rf out/ui-showcase out/dev
          node -e 'require("fs").writeFileSync("out/release.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID}))'
          test -s out/nutrition/index.html
          test -s out/training/index.html
          test -s out/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-source/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
