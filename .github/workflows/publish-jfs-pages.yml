name: Build and publish JFS Pages

# Publication is deliberately paused during single-main consolidation.
# Re-enabling deployment requires a separate, explicit release decision.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Explicitly authorize publishing the validated site"
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: jfs-pages-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_release == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pages:prepare
      - name: Commit built GitHub Pages files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build JFS Pages from validated cinematic app source"
            git push origin HEAD:main
          fi
