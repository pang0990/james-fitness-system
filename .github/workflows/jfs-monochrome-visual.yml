name: JFS Monochrome UI visual QA
on:
  pull_request:
    branches: [main, qa/web-four-workspaces-release-gate-20261022, design/all-pages-blackline-20261023, refactor/blackline-native-consolidation-20261023, feat/training-home-cycle-evidence-20261023]
    paths:
      - "app-source/**"
      - ".github/workflows/jfs-monochrome-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monochrome-browser:
    name: Monochrome mobile and desktop browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check monochrome visual and motion behavior
        run: npm run test:e2e -- tests/e2e/monochrome-experience.spec.ts tests/e2e/production-smoke.spec.ts tests/e2e/app-shell-v3.spec.ts tests/e2e/ds3-showcase-nutrition.spec.ts tests/e2e/glass-experience-v4.spec.ts tests/e2e/glass-design-system-v2.spec.ts tests/e2e/glass-crosspages.spec.ts tests/e2e/training-v3.spec.ts tests/e2e/glass-v3-hardening.spec.ts tests/e2e/black-line-crosspages.spec.ts --workers=2 --trace=retain-on-failure
        env:
          CI: "true"
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfs-monochrome-visual-qa
          path: |
            app-source/test-results/
            app-source/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  training-preview-export:
    name: Build isolated PR62 review preview to staging branch
    needs: monochrome-browser
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Read PR62 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
        working-directory: app-source
      - name: Build separate safe review site (fake data, no Supabase)
        working-directory: app-source
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /james-fitness-system/pr-preview/pr-62
          NEXT_PUBLIC_JFS_REVIEW_PREVIEW: "1"
          NEXT_PUBLIC_JFS_REVIEW_ID: "pr62"
      - name: Assert preview base URL exists in generated HTML
        run: |
          test -s app-source/out/index.html
          grep -q '/james-fitness-system/pr-preview/pr-62/' app-source/out/index.html
          test -s app-source/out/training/index.html
          test -s app-source/out/training/activity/index.html
      - name: Checkout staging branch (based on existing main, separate from app source)
        uses: actions/checkout@v4
        with:
          ref: preview/pr62-publish
          path: preview-publish
          persist-credentials: true
      - name: Prepare preview files without touching production root content
        run: |
          set -euo pipefail
          mkdir -p preview-publish/pr-preview/pr-62
          find preview-publish/pr-preview/pr-62 -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a app-source/out/. preview-publish/pr-preview/pr-62/
          cd preview-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pr-preview/pr-62
          if ! git diff --cached --quiet; then
            git commit -m "stage: isolated PR62 preview build (synthetic user data)"
            git push origin HEAD:preview/pr62-publish
          fi
          git rev-parse HEAD
